spring:
  application:
    name: queryon
  profiles:
    active: ${QUERYON_PROFILE:default}
  ai:
    dashscope:
      # 密钥只从系统环境变量 DASHSCOPE_API_KEY 读取，绝不写入仓库、代码或日志。
      # 不设置任何字面量与默认值；配置前缀在 M1a 引入 starter 时按官方文档复核。
      api-key: ${DASHSCOPE_API_KEY}
      # 具体模型名与额度／限流策略尚未确定，此处不填写。

# 以下为配置模板，M1a 依赖可行性验证通过后再启用；当前不引入未核实的数据源配置。
