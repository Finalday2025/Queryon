# 本地数据库编排：PostgreSQL + pgvector，端口映射宿主机（Q24）。
# 所有连接参数只以环境变量名引用，绝不写入仓库；不创建 .env 文件。
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: queryon-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - queryon-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?required} -d ${POSTGRES_DB:?required}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  queryon-pgdata:
