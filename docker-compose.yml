# 本地编排：PostgreSQL + pgvector、Redis、Queryon 后端（Q24、D8-07）。
# 所有连接参数只以环境变量名引用，绝不写入仓库；不创建 .env 文件。
# 应用默认 profile 为 offline（内存示例数据集），这里显式激活 dev 并指定 jdbc 数据源，
# 连接参数全部由下面的环境变量提供；镜像内不含 application-dev.yml（见 .dockerignore）。
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: queryon-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - queryon-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?required} -d ${POSTGRES_DB:?required}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: queryon-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?required}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - queryon-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: queryon-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 显式激活 dev 并走 jdbc 取数，不依赖本地 application-dev.yml 是否存在于镜像内。
      SPRING_PROFILES_ACTIVE: dev
      QUERYON_DATA_SOURCE: jdbc
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?required}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?required}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      SPRING_AI_DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-dummy}
    ports:
      - "8080:8080"

volumes:
  queryon-pgdata:
  queryon-redisdata:
